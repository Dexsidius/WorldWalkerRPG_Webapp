name: Paired Worldwalker Windows releases
on:
  workflow_dispatch:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: paired-worldwalker-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      WORLDWALKER_MODE: main
      WORLDWALKER_DATA_DIR: ${{ github.workspace }}/.build-test-data
      PYTHONUTF8: '1'
      PYTHONPATH: '${{ github.workspace }}/backend;${{ github.workspace }}/tests;${{ github.workspace }}/tools'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install runtime, test and packaging dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.16,<7" pytest playwright pillow
      - run: python -m playwright install chromium
      - name: Check JavaScript and tracked runtime data
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          subprocess.run(['python','tools/check_tracked_runtime.py'],check=True)
          for path in [*Path('frontend/js').glob('*.js'),Path('frontend/sw.js'),Path('frontend/tactical/campaign.js')]:
              subprocess.run(['node','--check',str(path)],check=True)
      - name: Main edition and real-interface regressions
        run: python -m pytest tests tools/check_workspace_tabs.py tools/check_reliability_browser.py tools/check_adventures_browser.py -q
      - name: Offline edition regressions without network generation
        env:
          WORLDWALKER_MODE: offline
        run: python -m pytest tests/test_offline_current.py tests/test_shared_editions.py tests/test_living_adventures.py tools/check_offline_browser.py -q
      - name: Build and verify both editions from this commit
        run: python tools/build_editions.py --output "${{ runner.temp }}/worldwalker-pair"
      - uses: actions/upload-artifact@v7
        with:
          name: Worldwalker-paired-Windows-${{ github.sha }}
          path: |
            ${{ runner.temp }}/worldwalker-pair/*.zip
            ${{ runner.temp }}/worldwalker-pair/RELEASE_PAIR.json
          if-no-files-found: error
          compression-level: 0
      - name: Publish both previews together
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'worldwalker-pair'
          pair=json.loads((root/'RELEASE_PAIR.json').read_text())
          assert len(pair['packages'])==2
          assert {p['source_commit'] for p in pair['packages']}=={os.environ['GITHUB_SHA']}
          notes=root/'release-notes.md'
          notes.write_text('Main and offline Worldwalker built from the same commit '+os.environ['GITHUB_SHA']+'.\n\nChoose the main or offline ZIP, extract the complete folder and keep _internal next to the executable. Saves remain separate. Both executables passed packaged startup checks; shared frontend and art files were verified against the source. See RELEASE_PAIR.json for hashes. Offline uses selections and local rules; AI-dependent features still need explicit local equivalents. This is a preview, not a promotion of the stable release.\n',encoding='utf-8')
          tag='paired-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
          subprocess.run(['gh','release','create',tag,*[str(root/p['file']) for p in pair['packages']],str(root/'RELEASE_PAIR.json'),'--repo',os.environ['GITHUB_REPOSITORY'],'--target',os.environ['GITHUB_SHA'],'--title','Worldwalker paired preview - '+pair['build_id'],'--notes-file',str(notes),'--prerelease','--latest=false'],check=True)
